[project]
name = "chromadose-web"
version = "0.1.0"
description = "FastAPI backend exposing the chromadose film-dosimetry library over HTTP"
requires-python = ">=3.11"
dependencies = [
    "chromadose[dicom]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.uv.sources]
chromadose = { path = "../../chromadose", editable = true }

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
